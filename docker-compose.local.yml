services:
  kaidoku:
    build:
      context: .
      dockerfile: Dockerfile
      target: full
    container_name: kaidoku-local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: Europe/Berlin
      GRADIO_SERVER_NAME: 0.0.0.0
      GRADIO_SERVER_PORT: 7860
      GRADIO_ALLOW_CORS: "true"
      GRADIO_SAMESITE: none
      KH_LOCALE: de
      KH_FEATURE_USER_MANAGEMENT: "true"
      AUTHENTICATION_METHOD: LOCAL
      KH_SSO_ENABLED: "false"
      KH_FEATURE_USER_MANAGEMENT_ADMIN: admin
      KH_FEATURE_USER_MANAGEMENT_PASSWORD: ChangeMe123!
    ports:
      - "7860:7860"
    volumes:
      - ./kaidoku_app_data:/app/ktem_app_data
      - ./sync-data:/app/sync-data
