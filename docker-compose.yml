services:
  kaidoku:
    build:
      context: .
      dockerfile: Dockerfile
      target: full
    container_name: kaidoku
    restart: unless-stopped
    environment:
      TZ: Europe/Berlin
      GRADIO_SERVER_NAME: 0.0.0.0
      GRADIO_SERVER_PORT: 7860
      GRADIO_ALLOW_CORS: "true"
      GRADIO_SAMESITE: none
      KH_LOCALE: de
      KH_FEATURE_USER_MANAGEMENT: "true"
      AUTHENTICATION_METHOD: ${AUTHENTICATION_METHOD:-LOCAL}
      KH_SSO_ENABLED: ${KH_SSO_ENABLED:-false}
      ADMIN_GROUPS: kaidoku-admins
      USER_GROUPS: kaidoku-users
      UPLOAD_ALLOWED_GROUPS: kaidoku-upload
      ACCESS_DENIED_GROUPS: ""
    ports:
      - "7860:7860"
    volumes:
      - ./kaidoku_app_data:/app/ktem_app_data
      - ./sync-data:/app/sync-data
